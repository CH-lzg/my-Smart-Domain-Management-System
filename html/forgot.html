<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>找回账号 / 密码 · 智域管家</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="login-page">
    <main class="recovery-shell">
      <section class="recovery-card">
        <a class="back-link" href="index.html">← 返回登录</a>
        <div class="brand-lockup">
          <div class="brand-mark">
            <img
              src="../assets/智域管家logo/智域家庭管家_透明PNG_300dpi.png"
              alt="智域管家 Logo"
            />
          </div>
          <div><strong>智域管家</strong><span>ACCOUNT RECOVERY</span></div>
        </div>
        <span class="eyebrow">ACCOUNT RECOVERY</span>
        <h1>找回账号 / 密码</h1>
        <p>输入注册时使用的用户名和手机号，验证后即可重置密码。</p>
        <form id="recoveryForm" novalidate>
          <label class="field-label" for="recoveryAccount">用户名</label>
          <input
            id="recoveryAccount"
            type="text"
            placeholder="请输入注册用户名"
          />
          <label class="field-label" for="recoveryPhone">手机号</label>
          <input id="recoveryPhone" type="tel" placeholder="请输入注册手机号" />
          <label class="field-label" for="newPassword">新密码</label>
          <input
            id="newPassword"
            type="password"
            placeholder="8-20位，含大小写字母与数字"
          />
          <button class="login-button" type="submit">
            重置密码 <span>→</span>
          </button>
          <div class="form-message" id="recoveryMessage" role="status"></div>
        </form>
      </section>
    </main>
    <script>
      const recoveryForm = document.getElementById('recoveryForm')
      recoveryForm.addEventListener('submit', (event) => {
        event.preventDefault()
        const account = document.getElementById('recoveryAccount').value.trim()
        const phone = document.getElementById('recoveryPhone').value.trim()
        const newPassword = document.getElementById('newPassword').value.trim()
        const message = document.getElementById('recoveryMessage')
        const accounts = JSON.parse(
          localStorage.getItem('zhiyuAccounts') || '[]',
        )
        const index = accounts.findIndex(
          (item) => item.account === account && item.phone === phone,
        )
        const validPassword =
          /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,20}$/.test(newPassword)
        if (index < 0) {
          message.textContent = '没有找到匹配的账号或手机号。'
          message.className = 'form-message error'
          return
        }
        if (!validPassword) {
          message.textContent = '新密码不符合安全要求。'
          message.className = 'form-message error'
          return
        }
        accounts[index].password = newPassword
        localStorage.setItem('zhiyuAccounts', JSON.stringify(accounts))
        message.textContent = '密码重置成功，请返回登录。'
        message.className = 'form-message success'
      })
    </script>
  </body>
</html>
